name: ci
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: wasm32-unknown-unknown,wasm32-wasip2 }
      - run: cargo install cargo-near --version 0.23.0 --locked
      - run: cargo test --workspace 2>&1 | tail -n 80
      - run: for c in contracts/nectar-core contracts/mock-ft; do (cd $c && cargo near build non-reproducible-wasm 2>&1 | tail -n 20); done
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version read from package.json packageManager (pnpm@10.34.9)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm --filter web build
      - run: pnpm --filter docs-site build
