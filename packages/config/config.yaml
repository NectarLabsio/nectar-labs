# packages/config/config.yaml — read by scripts, web, keeper, tests. Filled by scripts at gates.
network: testnet
accounts:
  owner: nectar.testnet # nectar.testnet
  core: nectar-core.nectar.testnet # nectar-core.nectar.testnet
  usdc_mock: usdc-mock.nectar.testnet # usdc-mock.nectar.testnet
  nvdax_mock: nvdax-mock.nectar.testnet # nvdax-mock.nectar.testnet
