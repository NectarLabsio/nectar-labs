    buyer1: buyer1.nectar.testnet
    buyer2: buyer2.nectar.testnet
    borrower1: borrower1.nectar.testnet
collateral:
  # PRD §6.2 field names, integers only (D-009). B_c = min(LTV_c·V_c, (1−h_c)(Q_c+R_c+D_c)).
  nvdax:
    symbol: NVDAx
    token: nvdax-mock.nectar.testnet # nvdax-mock.nectar.testnet
    decimals: 6
    price_feed_id: TODO-G5
    base_ltv_bps: 4000 # static limit without Nectar
    max_nectar_ltv_bps: 7000 # LTV_c ceiling with committed quotes
    base_haircut_bps: 1000 # h_c in session
    weekend_haircut_bps: 2500 # h_c when market_session_open == false (D_c forced to 0)
    limit_premium_bps: 300 # charged on borrow above base_ltv·V, up front from proceeds
    pre_liq_min_bps: 6500
    pre_liq_max_bps: 8000
    market_session_open: false # owner-set in P0
    verified_dex_depth_usd_e6: 0 # owner-set in P0; quoter in P1
    nectar_reserve_usd_e6: 0 # PROD
    remote_chain: null # P2: { chain_id: solana-devnet, vault_program: TODO-G7, mpc_domain_id: 1 }
    vol_bps: 420
quotes:
  default_max_discount_bps: 250
  min_notice_period_s: 604800 # 7 days (PRD §4.1)
  notice_presets_s: [604800, 2592000]
  min_quote_usd_e6: 100000000 # $100, storage-griefing floor (PRD §15)
fee_split: {buyers_bps: 7000, lenders_bps: 2000, treasury_bps: 1000} # PRD §4.3
keeper_fee_bps: 50
oracle:
  source: owner # set at G5
  max_age_s_session: 120 # PRD §8
  max_age_s_closed: 86400 # PRD §8, closed session (weekend haircut applies)
  band_bps: 1500 # PRD §8 sanity band; owner override propose/apply
  max_conf_bps: 100
