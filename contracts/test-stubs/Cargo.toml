[package]
name = "test-stubs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Sandbox-only stubs of outlayer.testnet request_execution (F-047/F-048) and Pyth get_price (F-054), MPC signer sign (WO-15). Never deployed to testnet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast"] } # WO-15 signer stub (sign from a fixed test seed; precomputed tables keep it inside 15 Tgas)

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
