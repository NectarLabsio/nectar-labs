# gitleaks config: default rules + one narrow allowlist. Public content hashes (wasm sha256 = OutLayer version_key, NEAR code_hash)
# are high-entropy but not secrets (FACTS F-045, F-140). Anything else still trips the default rules.
[extend]
useDefault = true

[allowlist]
description = "public content hashes, not secrets"
regexTarget = "line"
regexes = ['''^\s*(version_key|wasm_sha256|code_hash|sha256)\s*:\s*"?[0-9a-fA-F]{64}"?\s*(#.*)?$''']
