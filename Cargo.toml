[workspace]
resolver = "3"
# quoter/ is its own workspace
# (wasm32-wasip2, own Cargo.lock/profile) so it never conflicts with the NEAR contracts (P1, D-014).
members = ["contracts/nectar-core", "contracts/mock-ft", "contracts/test-stubs"]
exclude = ["quoter"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.1"   # F-010

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
